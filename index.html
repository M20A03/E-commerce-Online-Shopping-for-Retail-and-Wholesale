    <!-- ZERO FOUC INLINE THEME SCRIPT -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <style>
      /* Standalone Zero-Lag Preloader */
      .re-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #24160d 0%, #0d0805 100%);
        color: #f7ede2;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      .re-splash-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 163, 115, 0.28) 0%, rgba(212, 163, 115, 0) 70%);
        filter: blur(50px);
        animation: rePulse 3s ease-in-out infinite alternate;
      }
      .re-splash-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
        animation: reFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .re-splash-emblem {
        width: 86px;
        height: 86px;
        margin-bottom: 1.25rem;
        filter: drop-shadow(0 6px 18px rgba(212, 163, 115, 0.4));
        animation: reEmblemFloat 4s ease-in-out infinite;
      }
      .re-splash-title {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        background: linear-gradient(135deg, #fcead2 0%, #d4a373 50%, #b28b6e 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.25rem;
      }
      .re-splash-subtitle {
        font-size: 0.72rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #a89484;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }
      .re-splash-progress {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .re-splash-progress-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        background: linear-gradient(90deg, transparent, #d4a373, #fcead2, transparent);
        border-radius: 999px;
        animation: reShimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes rePulse {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 0.9; }
      }
      @keyframes reEmblemFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes reFadeIn {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes reShimmer {
        0% { left: -50%; }
        100% { left: 120%; }
      }
    </style>
